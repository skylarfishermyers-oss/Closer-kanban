<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Kanban Board</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #9e9e9a;
    --blue: #185FA5;
    --blue-light: #E6F1FB;
    --blue-text: #0C447C;
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
    --teal-text: #085041;
    --amber-light: #FAEEDA;
    --amber-text: #633806;
    --coral-light: #FAECE7;
    --coral-text: #712B13;
    --purple-light: #EEEDFE;
    --purple-text: #3C3489;
    --green: #1D9E75;
    --orange: #EF9F27;
    --red: #E24B4A;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  #topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
  #topbar h1 { font-size: 15px; font-weight: 600; color: var(--text); flex: 1; min-width: 120px; letter-spacing: -0.01em; }
  #sync-status { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
  .sync-dot.live { background: var(--green); }
  .sync-dot.syncing { background: var(--orange); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .btn { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; transition: background .12s; }
  .btn:hover { background: var(--surface2); }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.primary:hover { background: var(--blue-text); }
  .btn.success { background: var(--teal); color: #fff; border-color: var(--teal); }
  .btn.success:hover { background: var(--teal-text); }
  .btn.danger { color: #A32D2D; }
  #settings-panel { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 14px 20px; display: none; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  #settings-panel.open { display: flex; }
  #settings-panel label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 4px; }
  #settings-panel input { font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface); color: var(--text); width: 460px; outline: none; }
  .settings-hint { font-size: 11px; color: var(--text3); margin-top: 5px; }
  #board { display: flex; gap: 14px; padding: 16px 20px; overflow-x: auto; flex: 1; align-items: flex-start; }
  .col { background: var(--surface2); border-radius: var(--radius-lg); border: 1px solid var(--border); width: 240px; flex-shrink: 0; display: flex; flex-direction: column; max-height: calc(100vh - 80px); }
  .col-header { padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .col-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
  .col-count { font-size: 11px; color: var(--text3); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; }
  .col-body { padding: 8px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .col-drop-zone { min-height: 40px; }
  .add-btn { margin: 4px 8px 8px; padding: 7px; border: 1px dashed var(--border2); border-radius: var(--radius); background: none; color: var(--text3); font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; text-align: left; transition: all .12s; }
  .add-btn:hover { background: var(--surface); color: var(--text); border-color: var(--text3); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 12px; cursor: grab; transition: border-color .12s, box-shadow .12s; }
  .card:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .card.dragging { opacity: .4; }
  .card-title { font-size: 13px; font-weight: 500; line-height: 1.45; margin-bottom: 8px; color: var(--text); }
  .card-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .tag-blue { background: var(--blue-light); color: var(--blue-text); }
  .tag-teal { background: var(--teal-light); color: var(--teal-text); }
  .tag-amber { background: var(--amber-light); color: var(--amber-text); }
  .tag-coral { background: var(--coral-light); color: var(--coral-text); }
  .tag-purple { background: var(--purple-light); color: var(--purple-text); }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--blue-light); color: var(--blue-text); font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-left: auto; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 100; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); width: 460px; max-height: 85vh; overflow-y: auto; padding: 22px; position: relative; box-shadow: 0 8px 40px rgba(0,0,0,.14); }
  .modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; letter-spacing: -0.01em; }
  .modal label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; display: block; margin-top: 14px; margin-bottom: 5px; }
  .modal input, .modal textarea, .modal select { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 8px 11px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface); color: var(--text); outline: none; transition: border-color .12s; }
  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--blue); }
  .modal textarea { resize: vertical; min-height: 110px; font-family: 'DM Mono', monospace; font-size: 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
  .close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text3); line-height: 1; }
  .close-btn:hover { color: var(--text); }
  .ai-preview { background: var(--surface2); border-radius: var(--radius); padding: 9px 11px; margin-bottom: 7px; display: flex; align-items: flex-start; gap: 9px; border: 1px solid var(--border); }
  .ai-preview input[type=checkbox] { margin-top: 2px; flex-shrink: 0; }
  .ai-preview-title { font-size: 13px; font-weight: 500; line-height: 1.4; }
  .ai-preview-meta { font-size: 11px; color: var(--text2); margin-top: 3px; }
  #ai-loading { font-size: 13px; color: var(--text2); padding: 14px 0; display: none; }
  #ai-results { margin-top: 16px; display: none; }
  .ai-results-label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }
  .export-opt { display: block; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; margin-bottom: 8px; transition: background .12s; }
  .export-opt:hover { background: var(--surface); }
  .export-sub { font-size: 11px; color: var(--text2); font-weight: 400; display: block; margin-top: 2px; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a18; color: #f4f3ef; font-size: 13px; font-weight: 500; padding: 10px 18px; border-radius: var(--radius); display: none; z-index: 200; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
</style>
</head>
<body>

<div id="topbar">
  <h1>&#9635; Team Board</h1>
  <div id="sync-status">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">Connecting...</span>
  </div>
  <button class="btn success" onclick="manualSync()">&#8635; Sync Sheet</button>
  <button class="btn" onclick="openAIModal()">+ From meeting notes</button>
  <button class="btn" onclick="toggleSettings()">&#9881; Settings</button>
  <button class="btn" onclick="openExportModal()">&#8593; Export</button>
</div>

<div id="settings-panel">
  <div>
    <label>Apps Script Web App URL</label>
    <input type="text" id="cfg-url" placeholder="https://script.google.com/macros/s/...">
    <div class="settings-hint">Get this from Apps Script: Deploy &gt; New deployment &gt; Web app &gt; Execute as Me &gt; Anyone</div>
  </div>
  <button class="btn primary" onclick="saveSettings()">Save &amp; Connect</button>
</div>

<div id="board"></div>

<div class="overlay" id="card-overlay">
  <div class="modal">
    <button class="close-btn" onclick="closeCardModal()">&#x2715;</button>
    <h2 id="card-modal-title">New card</h2>
    <label>Title</label>
    <input type="text" id="f-title" placeholder="What needs to be done?">
    <label>Assignee</label>
    <input type="text" id="f-assignee" placeholder="Name or initials">
    <label>Column</label>
    <select id="f-col"></select>
    <label>Priority</label>
    <select id="f-priority">
      <option value="none">None</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <label>Labels</label>
    <input type="text" id="f-labels" placeholder="e.g. design, frontend (comma separated)">
    <div class="modal-actions">
      <button class="btn danger" id="f-delete" onclick="deleteCard()" style="margin-right:auto;display:none">Delete card</button>
      <button class="btn" onclick="closeCardModal()">Cancel</button>
      <button class="btn primary" onclick="saveCard()">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="ai-overlay">
  <div class="modal" style="width:520px">
    <button class="close-btn" onclick="closeAIModal()">&#x2715;</button>
    <h2>Parse meeting notes</h2>
    <label>Paste your meeting notes or transcript</label>
    <textarea id="ai-notes" placeholder="e.g.&#10;Action items:&#10;- John to draft Q2 proposal by Friday&#10;- Sarah will review the landing page designs&#10;- Need to schedule follow-up with the client&#10;&#10;Or paste a raw transcript — AI will extract action items automatically."></textarea>
    <div class="modal-actions" style="margin-top:12px">
      <button class="btn" onclick="closeAIModal()">Cancel</button>
      <button class="btn primary" onclick="runAIParse()">Extract action items &rarr;</button>
    </div>
    <div id="ai-loading">&#8230; Analyzing notes</div>
    <div id="ai-results">
      <div class="ai-results-label">Select items to add as cards</div>
      <div id="ai-list"></div>
      <div class="modal-actions">
        <button class="btn" onclick="document.getElementById('ai-results').style.display='none'">Clear</button>
        <button class="btn primary" onclick="importAICards()">Add selected to board &rarr;</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="export-overlay">
  <div class="modal" style="width:400px">
    <button class="close-btn" onclick="closeExportModal()">&#x2715;</button>
    <h2>Export board</h2>
    <button class="export-opt" onclick="exportCSV()">&#x1F4C4; Download as CSV<span class="export-sub">Import into Google Sheets via File &gt; Import</span></button>
    <button class="export-opt" onclick="exportICS()">&#x1F4C5; Download as ICS<span class="export-sub">Import calendar events into Google Calendar</span></button>
    <button class="export-opt" onclick="copyJSON()">&#x1F4CB; Copy as JSON<span class="export-sub">For developer or Apps Script use</span></button>
  </div>
</div>

<div id="toast"></div>

<script>
let CFG = { scriptUrl: 'https://script.google.com/macros/s/AKfycbyFNwOjz8ecoxWGxRm31se2o6ySETnSTJJTIX68Mb7RNC3xOY4uCDV0KjueIlyvj9UY/exec' };
const COLS = ['Backlog','To Do','In Progress','Review','Done'];
const PRI_TAG = { low:'tag-teal', medium:'tag-amber', high:'tag-coral', none:'' };

let state = { cols: COLS, cards: [
  {id:'c1',title:'Set up project repo',col:'Done',assignee:'AJ',priority:'none',labels:['dev']},
  {id:'c2',title:'Define Q2 goals with leadership',col:'Done',assignee:'SR',priority:'high',labels:['strategy']},
  {id:'c3',title:'Design new onboarding flow',col:'In Progress',assignee:'MK',priority:'high',labels:['design']},
  {id:'c4',title:'Write API documentation',col:'In Progress',assignee:'AJ',priority:'medium',labels:['dev']},
  {id:'c5',title:'Collect user feedback from beta',col:'To Do',assignee:'SR',priority:'medium',labels:['research']},
  {id:'c6',title:'Fix login timeout bug',col:'Review',assignee:'AJ',priority:'high',labels:['dev','bug']},
  {id:'c7',title:'Prepare client presentation deck',col:'Backlog',assignee:'MK',priority:'low',labels:['sales']},
]};

let dragCard = null, editingId = null;

function uid() { return 'c' + Date.now() + Math.random().toString(36).slice(2,6); }
function initials(n) { return n ? n.trim().split(/\s+/).map(w=>w[0].toUpperCase()).join('').slice(0,2) : '?'; }
function tagColor(l) {
  const m = {dev:'tag-blue',design:'tag-purple',research:'tag-teal',sales:'tag-amber',bug:'tag-coral',strategy:'tag-blue',frontend:'tag-blue',backend:'tag-teal',ops:'tag-amber',marketing:'tag-coral'};
  return m[l.toLowerCase()] || 'tag-blue';
}
function setStatus(s, label) { document.getElementById('sync-dot').className='sync-dot'+(s?' '+s:''); document.getElementById('sync-label').textContent=label; }
function showToast(msg, dur=2800) { const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',dur); }
function localSave() { try { localStorage.setItem('kanban_board', JSON.stringify(state)); } catch(e) {} }
function localLoad() { try { const s=localStorage.getItem('kanban_board'); if(s) state=JSON.parse(s); } catch(e) {} }
function cfgLoad() { try { const c=localStorage.getItem('kanban_cfg'); if(c) CFG={...CFG,...JSON.parse(c)}; } catch(e) {} }
function cfgSave() { try { localStorage.setItem('kanban_cfg', JSON.stringify(CFG)); } catch(e) {} }

function toggleSettings() {
  const p = document.getElementById('settings-panel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) document.getElementById('cfg-url').value = CFG.scriptUrl || '';
}
function saveSettings() {
  CFG.scriptUrl = document.getElementById('cfg-url').value.trim();
  cfgSave();
  document.getElementById('settings-panel').classList.remove('open');
  showToast('Settings saved — connecting...');
  pullFromSheet();
}

async function pullFromSheet() {
  if (!CFG.scriptUrl) { setStatus('error','No URL — click Settings'); return; }
  setStatus('syncing','Connecting...');
  try {
    const r = await fetch(CFG.scriptUrl + '?action=read');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    if (data.cards && data.cards.length > 0) {
      state.cards = data.cards;
      localSave(); render();
      setStatus('live','Synced with Sheet');
      showToast('Board loaded from Google Sheets');
    } else {
      await pushToSheet(state.cards);
    }
  } catch(e) {
    setStatus('error', e.message.slice(0,50));
    showToast('Sync error: ' + e.message, 5000);
  }
}

async function pushToSheet(cards) {
  if (!CFG.scriptUrl) return;
  setStatus('syncing','Syncing...');
  try {
    const r = await fetch(CFG.scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'write', cards })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    setStatus('live','Synced');
    showToast('Synced to Google Sheets');
  } catch(e) {
    setStatus('error', e.message.slice(0,50));
    showToast('Sync error: ' + e.message, 5000);
  }
}

async function manualSync() { await pullFromSheet(); }

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  state.cols.forEach(col => {
    const cards = state.cards.filter(c => c.col === col);
    const div = document.createElement('div');
    div.className = 'col'; div.dataset.col = col;
    div.innerHTML = `
      <div class="col-header">
        <span class="col-title">${col}</span>
        <span class="col-count">${cards.length}</span>
      </div>
      <div class="col-body" id="col-${col.replace(/\s/g,'_')}">
        ${cards.map(cardHTML).join('')}
        <div class="col-drop-zone"></div>
      </div>
      <button class="add-btn" onclick="openNewCard('${col}')">+ Add card</button>`;
    board.appendChild(div);
    setupDrop(div.querySelector('.col-body'));
  });
  setupDrag();
}

function cardHTML(c) {
  const labels = (c.labels||[]).map(l=>`<span class="tag ${tagColor(l)}">${l}</span>`).join('');
  const pri = c.priority&&c.priority!=='none'?`<span class="tag ${PRI_TAG[c.priority]}">${c.priority}</span>`:'';
  const av = c.assignee?`<div class="avatar" title="${c.assignee}">${initials(c.assignee)}</div>`:'';
  return `<div class="card" id="card-${c.id}" draggable="true" onclick="openEditCard('${c.id}')">
    <div class="card-title">${c.title}</div>
    <div class="card-meta">${pri}${labels}${av}</div>
  </div>`;
}

function setupDrag() {
  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('dragstart', e => { dragCard=el.id.replace('card-',''); el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend', async () => { el.classList.remove('dragging'); dragCard=null; localSave(); await pushToSheet(state.cards); });
  });
}

function setupDrop(zone) {
  zone.addEventListener('dragover', e => {
    e.preventDefault();
    const after = getDragAfter(zone, e.clientY);
    const el = document.getElementById('card-'+dragCard);
    if (!el) return;
    after===null ? zone.appendChild(el) : zone.insertBefore(el, after);
  });
  zone.addEventListener('drop', e => {
    e.preventDefault();
    if (!dragCard) return;
    const card = state.cards.find(c=>c.id===dragCard);
    if (card) card.col = zone.closest('.col').dataset.col;
    render();
  });
}

function getDragAfter(container, y) {
  return [...container.querySelectorAll('.card:not(.dragging)')].reduce((closest, child) => {
    const offset = y - child.getBoundingClientRect().top - child.getBoundingClientRect().height/2;
    return offset<0&&offset>closest.offset ? {offset,element:child} : closest;
  }, {offset:-Infinity}).element || null;
}

function openNewCard(col) {
  editingId = null;
  document.getElementById('card-modal-title').textContent = 'New card';
  ['f-title','f-assignee','f-labels'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-priority').value = 'none';
  document.getElementById('f-delete').style.display = 'none';
  populateColSelect(col||'To Do');
  document.getElementById('card-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),50);
}

function openEditCard(id) {
  const c = state.cards.find(x=>x.id===id); if (!c) return;
  editingId = id;
  document.getElementById('card-modal-title').textContent = 'Edit card';
  document.getElementById('f-title').value = c.title;
  document.getElementById('f-assignee').value = c.assignee||'';
  document.getElementById('f-priority').value = c.priority||'none';
  document.getElementById('f-labels').value = (c.labels||[]).join(', ');
  document.getElementById('f-delete').style.display = 'block';
  populateColSelect(c.col);
  document.getElementById('card-overlay').classList.add('open');
}

function populateColSelect(selected) {
  document.getElementById('f-col').innerHTML = state.cols.map(c=>`<option ${c===selected?'selected':''}>${c}</option>`).join('');
}

function closeCardModal() { document.getElementById('card-overlay').classList.remove('open'); editingId=null; }

async function saveCard() {
  const title = document.getElementById('f-title').value.trim(); if (!title) return;
  const data = { col:document.getElementById('f-col').value, assignee:document.getElementById('f-assignee').value.trim(), priority:document.getElementById('f-priority').value, labels:document.getElementById('f-labels').value.split(',').map(s=>s.trim()).filter(Boolean) };
  if (editingId) { Object.assign(state.cards.find(x=>x.id===editingId),{title,...data}); }
  else { state.cards.push({id:uid(),title,...data}); }
  closeCardModal(); localSave(); render();
  await pushToSheet(state.cards);
}

async function deleteCard() {
  if (!editingId) return;
  state.cards = state.cards.filter(c=>c.id!==editingId);
  closeCardModal(); localSave(); render();
  await pushToSheet(state.cards);
  showToast('Card deleted');
}

function openAIModal() { document.getElementById('ai-overlay').classList.add('open'); document.getElementById('ai-results').style.display='none'; document.getElementById('ai-loading').style.display='none'; document.getElementById('ai-notes').value=''; }
function closeAIModal() { document.getElementById('ai-overlay').classList.remove('open'); }

async function runAIParse() {
  const notes = document.getElementById('ai-notes').value.trim();
  if (!notes) { alert('Please paste some meeting notes first.'); return; }
  document.getElementById('ai-loading').style.display = 'block';
  document.getElementById('ai-results').style.display = 'none';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, messages:[{role:'user',content:`Extract all action items from these meeting notes. Return ONLY a JSON array, no prose or markdown. Each object must have: title (string, concise task), assignee (first name or ""), priority ("high"/"medium"/"low"/"none"), labels (array of 1-2 short lowercase strings like "design","dev","research","ops","marketing").\n\nNotes:\n${notes}`}] })
    });
    const data = await res.json();
    const text = data.content.map(b=>b.text||'').join('');
    renderAIResults(JSON.parse(text.replace(/```json|```/g,'').trim()));
  } catch(e) {
    document.getElementById('ai-loading').style.display = 'none';
    alert('Could not parse notes. Try again.');
  }
}

function renderAIResults(items) {
  document.getElementById('ai-loading').style.display = 'none';
  const list = document.getElementById('ai-list');
  list.innerHTML = items.map((item,i)=>`<div class="ai-preview"><input type="checkbox" checked data-idx="${i}"><div><div class="ai-preview-title">${item.title}</div><div class="ai-preview-meta">${item.assignee?'Assignee: '+item.assignee+' &bull; ':''}Priority: ${item.priority||'none'} &bull; ${(item.labels||[]).join(', ')}</div></div></div>`).join('');
  list.dataset.items = JSON.stringify(items);
  document.getElementById('ai-results').style.display = 'block';
}

async function importAICards() {
  const list = document.getElementById('ai-list');
  const items = JSON.parse(list.dataset.items||'[]');
  list.querySelectorAll('input[type=checkbox]').forEach((cb,i)=>{ if(cb.checked&&items[i]) state.cards.push({id:uid(),title:items[i].title,col:'To Do',assignee:items[i].assignee||'',priority:items[i].priority||'none',labels:items[i].labels||[]}); });
  closeAIModal(); localSave(); render();
  await pushToSheet(state.cards);
  showToast('Cards added and synced');
}

function openExportModal() { document.getElementById('export-overlay').classList.add('open'); }
function closeExportModal() { document.getElementById('export-overlay').classList.remove('open'); }
function exportCSV() { const h='Title,Assignee,Column,Priority,Labels'; const r=state.cards.map(c=>[`"${c.title}"`,c.assignee||'',c.col,c.priority||'none',(c.labels||[]).join(';')].join(',')); download('kanban.csv','text/csv',[h,...r].join('\n')); closeExportModal(); showToast('CSV downloaded'); }
function exportICS() { const l=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KanbanBoard//EN']; state.cards.forEach(c=>{ const dt=new Date(); dt.setDate(dt.getDate()+7); const ds=dt.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; l.push('BEGIN:VEVENT',`UID:${c.id}@kanban`,`DTSTART:${ds}`,`SUMMARY:${c.title}`,`DESCRIPTION:Assignee: ${c.assignee||'unassigned'} | Priority: ${c.priority}`,'END:VEVENT'); }); l.push('END:VCALENDAR'); download('kanban.ics','text/calendar',l.join('\r\n')); closeExportModal(); showToast('ICS downloaded'); }
function copyJSON() { navigator.clipboard.writeText(JSON.stringify(state,null,2)).then(()=>{ closeExportModal(); showToast('JSON copied to clipboard'); }); }
function download(filename, type, content) { const a=document.createElement('a'); a.href='data:'+type+';charset=utf-8,'+encodeURIComponent(content); a.download=filename; a.click(); }

cfgLoad(); localLoad(); render(); pullFromSheet();
</script>
</body>
</html>
